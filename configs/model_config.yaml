# ==================== АРХИТЕКТУРА МОДЕЛИ ====================

vocab_size: 500          # Размер словаря (сколько уникальных токенов)
d_model: 128               # Размерность эмбеддингов
n_heads: 4                 # Количество голов внимания
n_layers: 3                # Количество слоев трансформера
d_ff: 512                 # Размер скрытого слоя в FFN (обычно d_model * 4)
max_len: 1024              # Максимальная длина последовательности
dropout: 0.1               # Вероятность dropout
pad_token_id: 0            # ID токена для padding

# ==================== ПАРАМЕТРЫ ОБУЧЕНИЯ ====================
learning_rate: 0.0003      # Скорость обучения (3e-4)
weight_decay: 0.01         # Регуляризация (L2)
gradient_clip_val: 1.0     # Обрезка градиентов
warmup_steps: 1000         # Количество шагов прогрева
max_steps: 50000           # Максимальное количество шагов
max_epochs: 3              # Максимальное количество эпох

# ==================== ДАННЫЕ ====================
batch_size: 16             # Размер батча
num_workers: 4             # Количество потоков для загрузки данных
data_path: "../data/"       # Путь к данным

# ==================== ЛОГИРОВАНИЕ ====================
logs_dir: "logs/"
checkpoint_dir: "checkpoints/"